---
name: Update Coding Standards

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Coding standards release tag, or latest'
        required: false
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Materialize coding standards
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve, verify, and materialize coding standards
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          readonly config_file='.codingstandardrc'
          readonly upstream_repo='wesley-dean/coding_standards'
          readonly destination='doc/standards'

          fail() {
            printf 'error: %s\n' "$1" >&2
            exit 1
          }

          read_existing_version() {
            local line
            local version=''

            [[ -f ${config_file} ]] || return 0

            while IFS= read -r line || [[ -n ${line} ]]; do
              [[ -z ${line} || ${line} == \#* ]] && continue
              [[ ${line} == *=* ]] || fail "malformed line in ${config_file}: ${line}"

              if [[ ${line%%=*} == CODING_STANDARD_VERSION ]]; then
                [[ -z ${version} ]] || fail 'duplicate CODING_STANDARD_VERSION'
                version=${line#*=}
              fi
            done <"${config_file}"

            printf '%s\n' "${version}"
          }

          read_config() {
            local line
            local key
            local value

            coding_standard=()
            while IFS= read -r line || [[ -n ${line} ]]; do
              [[ -z ${line} || ${line} == \#* ]] && continue
              [[ ${line} == *=* ]] || fail "malformed line in ${config_file}: ${line}"

              key=${line%%=*}
              value=${line#*=}
              case ${key} in
                CODING_STANDARD_VERSION|CODING_STANDARD_HASH|CODING_STANDARD_URL|CODING_STANDARD_DESTINATION)
                  ;;
                *)
                  fail "unsupported key in ${config_file}: ${key}"
                  ;;
              esac

              [[ -z ${coding_standard[${key}]+x} ]] || \
                fail "duplicate key in ${config_file}: ${key}"
              coding_standard[${key}]=${value}
            done <"${config_file}"
          }

          current_version="$(read_existing_version)"
          requested_version=${REQUESTED_VERSION:-${current_version:-latest}}

          if [[ ${requested_version} == latest ]]; then
            release_json="$(gh api "repos/${upstream_repo}/releases/latest")"
          else
            release_json="$(gh api "repos/${upstream_repo}/releases/tags/${requested_version}")"
          fi

          resolved_version="$(jq -r '.tag_name' <<<"${release_json}")"
          archive_url="$(jq -r '.tarball_url' <<<"${release_json}")"

          [[ ${resolved_version} =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || \
            fail "unsafe release tag: ${resolved_version}"
          [[ ${archive_url} == "https://api.github.com/repos/${upstream_repo}/tarball/${resolved_version}" ]] || \
            fail 'release tarball URL does not match the resolved coding-standards release'

          # The existing v1.0.0 release has only GitHub's generated source archive,
          # so this proof of concept cannot know the archive digest until after the
          # first download.  Populate the configuration first, download from that
          # configuration, then complete the hash field from the downloaded bytes.
          cat >"${config_file}" <<EOF
          CODING_STANDARD_VERSION=${resolved_version}
          CODING_STANDARD_HASH=
          CODING_STANDARD_URL=${archive_url}
          CODING_STANDARD_DESTINATION=${destination}
          EOF

          declare -A coding_standard=()
          read_config

          [[ ${coding_standard[CODING_STANDARD_VERSION]:-} == "${resolved_version}" ]] || \
            fail 'configured standards version changed during population'
          [[ ${coding_standard[CODING_STANDARD_URL]:-} == "${archive_url}" ]] || \
            fail 'configured standards URL changed during population'
          [[ ${coding_standard[CODING_STANDARD_DESTINATION]:-} == doc/standards ]] || \
            fail 'CODING_STANDARD_DESTINATION must be doc/standards'
          [[ -z ${coding_standard[CODING_STANDARD_HASH]:-} ]] || \
            fail 'initial proof-of-concept hash must be empty before download'

          archive_file="${RUNNER_TEMP}/coding-standards-source.tar.gz"
          curl \
            -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${coding_standard[CODING_STANDARD_URL]}" \
            -o "${archive_file}"

          actual_hash="$(sha256sum "${archive_file}" | awk '{print $1}')"
          [[ ${actual_hash} =~ ^[[:xdigit:]]{64}$ ]] || fail 'unable to calculate source archive SHA-256'
          actual_hash=${actual_hash,,}

          cat >"${config_file}" <<EOF
          CODING_STANDARD_VERSION=${resolved_version}
          CODING_STANDARD_HASH=sha256:${actual_hash}
          CODING_STANDARD_URL=${archive_url}
          CODING_STANDARD_DESTINATION=${destination}
          EOF

          read_config

          for key in \
            CODING_STANDARD_VERSION \
            CODING_STANDARD_HASH \
            CODING_STANDARD_URL \
            CODING_STANDARD_DESTINATION; do
            [[ -n ${coding_standard[${key}]:-} ]] || fail "missing key in ${config_file}: ${key}"
          done

          [[ ${coding_standard[CODING_STANDARD_VERSION]} == "${resolved_version}" ]] || \
            fail 'final configured standards version is incorrect'
          [[ ${coding_standard[CODING_STANDARD_HASH]} == "sha256:${actual_hash}" ]] || \
            fail 'final configured standards hash is incorrect'
          [[ ${coding_standard[CODING_STANDARD_URL]} == "${archive_url}" ]] || \
            fail 'final configured standards URL is incorrect'
          [[ ${coding_standard[CODING_STANDARD_DESTINATION]} == doc/standards ]] || \
            fail 'final configured standards destination is incorrect'

          while IFS= read -r entry; do
            normalized=${entry#./}
            case ${normalized} in
              ''|.)
                continue
                ;;
              /*|..|../*|*/../*|*/..)
                fail "unsafe archive member: ${entry}"
                ;;
            esac
          done < <(tar -tzf "${archive_file}")

          if tar -tvzf "${archive_file}" | awk '$1 ~ /^[lh]/ { found=1 } END { exit !found }'; then
            fail 'archive contains a symbolic or hard link'
          fi

          source_stage="$(mktemp -d "${RUNNER_TEMP}/coding-standards-source.XXXXXX")"
          standards_stage="$(mktemp -d "${RUNNER_TEMP}/coding-standards.XXXXXX")"
          trap 'find "${source_stage}" -mindepth 1 -delete 2>/dev/null || true; rmdir "${source_stage}" 2>/dev/null || true; find "${standards_stage}" -mindepth 1 -delete 2>/dev/null || true; rmdir "${standards_stage}" 2>/dev/null || true' EXIT

          tar -xzf "${archive_file}" -C "${source_stage}"

          mapfile -t source_roots < <(find "${source_stage}" -mindepth 1 -maxdepth 1 -print)
          [[ ${#source_roots[@]} -eq 1 ]] || fail 'source archive must contain exactly one repository root'
          [[ -d ${source_roots[0]} ]] || fail 'source archive repository root is not a directory'
          [[ -d ${source_roots[0]}/standards ]] || fail 'source archive does not contain standards/'

          cp -a "${source_roots[0]}/standards/." "${standards_stage}/"

          mkdir -p "${coding_standard[CODING_STANDARD_DESTINATION]}"
          find "${coding_standard[CODING_STANDARD_DESTINATION]}" -mindepth 1 -delete
          cp -a "${standards_stage}/." "${coding_standard[CODING_STANDARD_DESTINATION]}/"

          printf '%s\n' 'Resolved configuration:'
          cat "${config_file}"
          printf '%s\n' 'Materialized documentation tree:'
          find doc/ -print
