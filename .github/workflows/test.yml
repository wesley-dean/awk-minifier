---
name: Test

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes busybox curl doxygen gawk graphviz make mawk

      - name: Verify build is independent of dependency acquisition
        run: |
          test ! -e vendor
          make build
          test ! -e vendor

      - name: Validate maintained source
        run: make check

      - name: Synchronize and verify repository tools
        run: |
          make deps
          make deps-check
          test -f vendor/doxygen-awk.awk
          test -f vendor/adrctl.bash

      - name: Synchronize and verify shared standards
        run: |
          make standards
          make standards-check
          test -f doc/standards/general/clean-architecture-standard.md
          test -f doc/standards/general/clean-coding-standard.md
          test -f doc/standards/general/conventional-commit-release-governance.md
          test -f doc/standards/awk/documentation-standard.md
          test -f doc/standards/examples/awk/documentation/example.awk
          git check-ignore -q doc/standards/awk/documentation-standard.md

      - name: Verify distribution artifacts and checksums
        run: |
          mapfile -t artifacts < <(find dist -maxdepth 1 -type f -name 'awk-minifier*.awk' -perm -u+x -print | sort)
          test "${#artifacts[@]}" -eq 3
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}.sha256"
            (cd dist && sha256sum -c "$(basename "${artifact}").sha256")
          done
          cmp dist/awk-minifier.dev.awk dist/awk-minifier.min.awk
          if cmp -s dist/awk-minifier.dev.awk dist/awk-minifier.awk; then
            printf '%s\n' 'ordinary artifact unexpectedly equals development artifact' >&2
            exit 1
          fi
          if grep -q '^##' dist/awk-minifier.awk; then
            printf '%s\n' 'ordinary artifact retained Doxygen documentation lines' >&2
            exit 1
          fi

      - name: Verify deterministic build output
        run: |
          mkdir -p "${RUNNER_TEMP}/first-build"
          cp dist/*.awk dist/*.awk.sha256 "${RUNNER_TEMP}/first-build/"
          make build
          for path in dist/*.awk dist/*.awk.sha256; do
            cmp "${RUNNER_TEMP}/first-build/$(basename "${path}")" "${path}"
          done

      - name: Test default AWK
        run: make test

      - name: Test GNU awk
        run: make test AWK_BIN=gawk

      - name: Test mawk
        run: make test AWK_BIN=mawk

      - name: Test BusyBox awk
        run: |
          mkdir -p "${RUNNER_TEMP}/busybox-awk"
          ln -s "$(command -v busybox)" "${RUNNER_TEMP}/busybox-awk/awk"
          make test AWK_BIN="${RUNNER_TEMP}/busybox-awk/awk"

      - name: Generate documentation from prepared dependencies
        run: |
          make docs
          make deps-check
          test -f doc/adr/README.md
          grep -Fq 'ADR-021: AWK Documentation and Portability Testing' doc/adr/README.md
          git check-ignore -q doc/adr/README.md
          test -f doc/reference/html/index.html
          git check-ignore -q doc/reference/html/index.html

  macos:
    name: macOS AWK
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test with system AWK
        run: |
          make build
          make check AWK_BIN=/usr/bin/awk
          make test AWK_BIN=/usr/bin/awk
