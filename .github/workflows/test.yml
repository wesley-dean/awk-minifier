---
name: Test

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes busybox curl doxygen gawk graphviz make mawk original-awk

      - name: Verify build does not acquire missing dependencies
        run: |
          test ! -e vendor
          if make build; then
            printf '%s\n' 'build unexpectedly succeeded without prepared minifier dependency' >&2
            exit 1
          fi
          test ! -e vendor
          test ! -e dist

      - name: Validate maintained source
        run: make check

      - name: Synchronize and verify repository tools
        run: |
          make deps
          make deps-check
          test -f vendor/doxygen-awk.awk
          test -f vendor/adrctl.bash
          test -f vendor/awk-minifier.awk

      - name: Build with prepared dependencies
        run: make build

      - name: Synchronize and verify shared standards
        run: |
          make standards
          make standards-check
          test -f doc/standards/general/clean-architecture-standard.md
          test -f doc/standards/general/clean-coding-standard.md
          test -f doc/standards/general/conventional-commit-release-governance.md
          test -f doc/standards/awk/documentation-standard.md
          test -f doc/standards/examples/awk/documentation/example.awk
          git check-ignore -q doc/standards/awk/documentation-standard.md

      - name: Verify distribution artifacts and checksums
        run: |
          mapfile -t artifacts < <(find dist -maxdepth 1 -type f -name 'awk-minifier*.awk' -perm -u+x -print | sort)
          test "${#artifacts[@]}" -eq 3
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}.sha256"
            (cd dist && sha256sum -c "$(basename "${artifact}").sha256")
          done

          grep -Fq '# Artifact: development' dist/awk-minifier.dev.awk
          grep -Fq '# Artifact: ordinary' dist/awk-minifier.awk
          grep -Fq '# Artifact: minified' dist/awk-minifier.min.awk
          grep -Fq '# Minifier: AWK Minifier v0.2.1' dist/awk-minifier.min.awk

          if cmp -s dist/awk-minifier.dev.awk dist/awk-minifier.awk; then
            printf '%s\n' 'ordinary artifact unexpectedly equals development artifact' >&2
            exit 1
          fi
          if cmp -s dist/awk-minifier.awk dist/awk-minifier.min.awk; then
            printf '%s\n' 'minified artifact unexpectedly equals ordinary artifact' >&2
            exit 1
          fi
          if grep -q '^##' dist/awk-minifier.awk; then
            printf '%s\n' 'ordinary artifact retained Doxygen documentation lines' >&2
            exit 1
          fi
          if grep -q '^##' dist/awk-minifier.min.awk; then
            printf '%s\n' 'minified artifact retained Doxygen documentation lines' >&2
            exit 1
          fi

          expected_body="${RUNNER_TEMP}/expected-minified-body.awk"
          actual_body="${RUNNER_TEMP}/actual-minified-body.awk"
          sed '1,/^# End generated header\.$/d' dist/awk-minifier.awk |
            awk -f vendor/awk-minifier.awk >"${expected_body}"
          sed '1,/^# End generated header\.$/d' dist/awk-minifier.min.awk >"${actual_body}"
          cmp "${expected_body}" "${actual_body}"
          test "$(tr -cd '\n' <"${actual_body}" | wc -c | tr -d '[:space:]')" -eq 0

      - name: Verify deterministic build output
        run: |
          mkdir -p "${RUNNER_TEMP}/first-build"
          cp dist/*.awk dist/*.awk.sha256 "${RUNNER_TEMP}/first-build/"
          rm -rf dist
          make build
          for path in dist/*.awk dist/*.awk.sha256; do
            cmp "${RUNNER_TEMP}/first-build/$(basename "${path}")" "${path}"
          done

      - name: Test default AWK
        run: make test

      - name: Test GNU awk
        run: make test AWK_BIN=gawk

      - name: Test mawk
        run: make test AWK_BIN=mawk

      - name: Test original awk
        run: make test AWK_BIN=original-awk

      - name: Test BusyBox awk
        run: |
          mkdir -p "${RUNNER_TEMP}/busybox-awk"
          ln -s "$(command -v busybox)" "${RUNNER_TEMP}/busybox-awk/awk"
          make test AWK_BIN="${RUNNER_TEMP}/busybox-awk/awk"

      - name: Generate documentation from prepared dependencies
        run: |
          make docs
          make deps-check
          test -f doc/adr/README.md
          grep -Fq 'ADR-024: Pin v0.2.1 as the Production Minification Transformer' doc/adr/README.md
          git check-ignore -q doc/adr/README.md
          test -f doc/reference/html/index.html
          git check-ignore -q doc/reference/html/index.html
